<mat-card>

  <mat-card-title>
    Buy / Sell
  </mat-card-title>

  <mat-form-field class="w-100">
    <input
      matInput
      placeholder="Quantity">
  </mat-form-field>

  <mat-form-field class="w-100">
    <input
      matInput
      placeholder="Price">
  </mat-form-field>

  <button
    mat-raised-button
    color="primary">

    BUY

  </button>

  <button
    mat-raised-button
    color="warn">

    SELL

  </button>

</mat-card>
