<mat-card>
  <mat-card-title>Market Watch</mat-card-title>
  <mat-list>
    <!-- Loops over 'stocks' array. 'stock' is created dynamically for each item -->
    <mat-list-item *ngFor="let stock of stocks">
      <div class="stock-row">
        <span>{{ stock.symbol }}</span>
        <!-- Applies class dynamically based on stock performance -->
        <span [ngClass]="stock.change > 0 ? 'green' : 'red'">
          ${{ stock.price | number:'1.2-2' }}
        </span>
      </div>
    </mat-list-item>
  </mat-list>
</mat-card>
