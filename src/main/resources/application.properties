server.servlet.context-path=/login
server.port=${SERVER_PORT:8080}

app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.api.base-path=${API_BASE_PATH:/api}
app.cors.allowed-origin=${FRONTEND_ORIGIN:${app.frontend-url}}
app.market.websocket-path=${MARKET_WEBSOCKET_PATH:/ws/market}
app.security.trade-api-enabled=${TRADE_API_ENABLED:true}

# Local demo access only. Disable before exposing this service publicly.
# Quotes and orders are currently stored in memory; no database is configured.
